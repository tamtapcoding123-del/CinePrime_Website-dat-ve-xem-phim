name: CinePrime CI

# Y5: tự chạy test khi push / pull request, hỗ trợ chạy riêng nhóm smoke, upload báo cáo lên Artifacts.
on:
  push:
    branches: [ main, kiem-thu, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      group:
        description: "Nhóm Selenium cần chạy: smoke (nhanh) hoặc all (đầy đủ)"
        required: true
        default: smoke
        type: choice
        options: [ smoke, all ]

env:
  DB_NAME: cineprime_test
  DB_USER: cineprime
  DB_PASSWORD: ci-only-password       # chỉ dùng cho MySQL tạm của runner, không phải mật khẩu thật
  DEMO_PASSWORD: ci-demo-password-1   # >= 10 ký tự, chỉ dùng cho dữ liệu demo trên runner

jobs:
  # Job 1: JUnit 5 (unit + MockMvc + tích hợp MySQL) trên MySQL thật, không dùng H2.
  junit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: cineprime_test
          MYSQL_USER: cineprime
          MYSQL_PASSWORD: ci-only-password
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Chạy JUnit 5 (toàn bộ test không phải Selenium)
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/cineprime_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          TEST_DB_USER: cineprime
          TEST_DB_PASSWORD: ci-only-password
        run: ./mvnw -B -ntp test
      - name: Upload báo cáo JUnit (surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: target/surefire-reports/
          if-no-files-found: warn

  # Job 2: Selenium + TestNG. Dựng ứng dụng thật (JAR) trên MySQL, nạp dữ liệu demo rồi điều khiển Chrome headless.
  selenium:
    runs-on: ubuntu-latest
    needs: junit
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: cineprime_ui
          MYSQL_USER: cineprime
          MYSQL_PASSWORD: ci-only-password
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Đóng gói ứng dụng (bỏ qua test, đã chạy ở job junit)
        run: ./mvnw -B -ntp -DskipTests package
      - name: Khởi động ứng dụng ở cổng 8081 với dữ liệu demo
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/cineprime_ui?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          DB_USER: cineprime
          DB_PASSWORD: ci-only-password
          DEMO_SEED: 'true'
          BASE_URL: http://localhost:8081
          UPLOAD_DIR: ${{ runner.temp }}/uploads
        run: |
          nohup java -jar target/cineprime-1.0.0.jar --server.port=8081 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8081/login > /dev/null && echo "App sẵn sàng sau $i lần thử" && exit 0; sleep 3; done
          echo "App không khởi động được"; tail -50 app.log; exit 1
      - name: Chạy Selenium nhóm smoke (push / pull request) hoặc toàn bộ (chạy tay chọn all)
        run: |
          PROFILE=smoke
          if [ "${{ github.event.inputs.group }}" = "all" ]; then PROFILE=ui; fi
          ./mvnw -B -ntp test -P$PROFILE -Dbase.url=http://localhost:8081 -Ddemo.password="$DEMO_PASSWORD" -Dheadless=true
      - name: Upload báo cáo TestNG + ảnh chụp lỗi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-testng-report
          path: |
            target/surefire-reports/
            target/screenshots/
            app.log
          if-no-files-found: warn
